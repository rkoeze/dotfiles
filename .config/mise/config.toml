[settings]
experimental = true
minimum_release_age = "0s"

[tools]
java = "25"
node = "22"
pnpm = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
uv = "0.11.28"

[settings.npm]
package_manager = "pnpm"

[tasks.pi]
description = "Run Pi"
tools.node = "22"
dir = "{{cwd}}"
raw = true
raw_args = true
quiet = true
run = "exec pi"
